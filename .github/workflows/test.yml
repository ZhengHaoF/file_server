name: Test
on:
  push:
  pull_request:
jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix server ci
      - run: npm --prefix web ci
      - run: npm --prefix admin ci
      - run: npm --prefix server run check
      - run: npm --prefix web test -- --run
      - run: npm --prefix admin test -- --run
      - run: npm run assemble
      - run: npm run pack
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter-app
      - run: flutter analyze --no-fatal-infos
        working-directory: flutter-app
      - run: flutter test
        working-directory: flutter-app
  flutter-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter-app
      - run: flutter test
        working-directory: flutter-app
      - run: flutter build windows --release
        working-directory: flutter-app
      - uses: actions/upload-artifact@v4
        with:
          name: z-files-windows-release
          path: flutter-app/build/windows/x64/runner/Release/
  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter-app
      - run: flutter build apk --debug
        working-directory: flutter-app
      - uses: actions/upload-artifact@v4
        with:
          name: z-files-android-debug
          path: flutter-app/build/app/outputs/flutter-apk/app-debug.apk
  flutter-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: flutter-app
      - run: flutter build ios --simulator --debug
        working-directory: flutter-app
