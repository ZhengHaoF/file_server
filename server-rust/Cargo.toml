[package]
name = "file-server"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
description = "File Serve NAS file server (Rust backend hosting web + admin)"
license = "ISC"
publish = false

[[bin]]
name = "file-server"
path = "src/main.rs"

[lib]
name = "file_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "tokio", "service"] }
mime_guess = "2"
percent-encoding = "2"
rand = "0.9"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "signal", "process"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
tempfile = "3"
tokio-tungstenite = "0.27"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
