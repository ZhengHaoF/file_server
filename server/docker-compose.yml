services:
  file-serve:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: file-serve
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./config.local.json:/usr/src/app/config.local.json:ro
      - ./files:/usr/src/app/files:rw
      - file-serve-data:/usr/src/app/data
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # Docker provides restart supervision; do not nest another supervisor.
volumes:
  file-serve-data:
